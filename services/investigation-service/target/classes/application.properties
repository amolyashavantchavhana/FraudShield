
# Application Configuration
spring.application.name=investigation-service
server.port=8091

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/FraudShield
spring.datasource.username=root
spring.datasource.password=Amol@4483
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false



# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=fraud_investigation_group
spring.kafka.consumer.auto-offset-reset=earliest

# Key Deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Error Handling Deserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate JSON Deserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON Deserialization Configuration
spring.kafka.consumer.properties.spring.json.value.default.type=com.fraudshield.investigation.messaging.event.FlaggedTransactionEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fraudshield.investigation.messaging.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false

#kafka listener
spring.kafka.listener.auto-startup=false
